<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>.card-circle demo</title>
  <style>
    body{
      margin:0; padding:24px;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#f6f6f6;
    }

    .wrap{display:flex; gap:16px; align-items:center; flex-wrap:wrap;}

    .card-circle{
      width:20px;height:20px;border-radius:50%;
      background:#fff;color:#111;
      display:flex;align-items:center;justify-content:center;
      font-weight:900;font-size:11px;
      flex:0 0 auto;
      position:relative;
      clip-path:polygon(
        50% 0%,
        60% 12%,
        75% 8%,
        70% 25%,
        90% 25%,
        78% 38%,
        92% 50%,
        78% 62%,
        90% 75%,
        70% 75%,
        75% 92%,
        60% 88%,
        50% 100%,
        40% 88%,
        25% 92%,
        30% 75%,
        10% 75%,
        22% 62%,
        8% 50%,
        22% 38%,
        10% 25%,
        30% 25%,
        25% 8%,
        40% 12%
      );
      box-shadow:0 2px 8px rgba(0,0,0,.12);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card-circle">2</div>
    <div class="card-circle">3</div>
    <div class="card-circle">10</div>
  </div>
</body>
</html>
